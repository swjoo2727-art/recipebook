<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Recipe Book 🍳</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf7f2;
    --warm-white: #fff9f0;
    --brown: #3d2b1f;
    --rust: #c4623a;
    --sage: #7a9e7e;
    --gold: #d4a853;
    --light-sage: #eef4ef;
    --light-rust: #fdf0ea;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--brown);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--brown);
    padding: 48px 24px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(196,98,58,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(122,158,126,0.2) 0%, transparent 60%);
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    color: var(--cream);
    position: relative;
    letter-spacing: -0.5px;
  }

  header p {
    font-size: 0.95rem;
    color: rgba(250,247,242,0.6);
    margin-top: 8px;
    font-weight: 300;
    letter-spacing: 0.5px;
    position: relative;
  }

  .heart {
    color: var(--rust);
    font-size: 1.1em;
  }

  /* NAV / FILTER */
  .filter-bar {
    display: flex;
    gap: 10px;
    padding: 24px 24px 0;
    flex-wrap: wrap;
    max-width: 1100px;
    margin: 0 auto;
    align-items: center;
  }

  .filter-label {
    font-size: 0.78rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--brown);
    opacity: 0.5;
    margin-right: 4px;
  }

  .filter-btn {
    padding: 7px 18px;
    border-radius: 100px;
    border: 1.5px solid var(--brown);
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--brown);
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.5;
  }

  .filter-btn:hover { opacity: 1; }

  .filter-btn.active {
    background: var(--brown);
    color: var(--cream);
    opacity: 1;
  }

  /* SEARCH */
  .search-wrap {
    max-width: 1100px;
    margin: 16px auto 0;
    padding: 0 24px;
  }

  .search-wrap input {
    width: 100%;
    max-width: 360px;
    padding: 10px 18px;
    border-radius: 100px;
    border: 1.5px solid rgba(61,43,31,0.2);
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--brown);
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus {
    border-color: var(--rust);
  }

  .search-wrap input::placeholder { color: rgba(61,43,31,0.35); }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 28px auto 60px;
    padding: 0 24px;
  }

  /* CARD */
  .card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
    box-shadow: 0 2px 12px rgba(61,43,31,0.07);
    border: 1px solid rgba(61,43,31,0.06);
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(61,43,31,0.13);
  }

  .card-color {
    height: 8px;
  }

  .card-body {
    padding: 22px 24px 20px;
  }

  .card-tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 100px;
    margin-bottom: 10px;
  }

  .tag-korean { background: var(--light-rust); color: var(--rust); }
  .tag-western { background: var(--light-sage); color: #4a7a4e; }
  .tag-baking { background: #fef8ec; color: #a07a20; }

  .bar-korean { background: var(--rust); }
  .bar-western { background: var(--sage); }
  .bar-baking { background: var(--gold); }

  .card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .card p.desc {
    font-size: 0.85rem;
    color: rgba(61,43,31,0.55);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .card-meta {
    display: flex;
    gap: 14px;
    font-size: 0.78rem;
    color: rgba(61,43,31,0.45);
  }

  .card-meta span { display: flex; align-items: center; gap: 4px; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30,18,10,0.55);
    backdrop-filter: blur(4px);
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
    align-items: flex-start;
    justify-content: center;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: var(--warm-white);
    border-radius: 24px;
    max-width: 640px;
    width: 100%;
    margin: auto;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(30,18,10,0.25);
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-header {
    padding: 32px 36px 24px;
    border-bottom: 1px solid rgba(61,43,31,0.08);
    position: relative;
  }

  .modal-header .tag { margin-bottom: 10px; }

  .modal-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    line-height: 1.25;
  }

  .modal-header .korean-name {
    font-size: 0.9rem;
    color: rgba(61,43,31,0.45);
    margin-top: 4px;
    font-style: italic;
  }

  .close-btn {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(61,43,31,0.08);
    color: var(--brown);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .close-btn:hover { background: rgba(61,43,31,0.15); }

  .modal-body {
    padding: 28px 36px 36px;
  }

  .modal-tip {
    background: var(--light-rust);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.83rem;
    color: var(--rust);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .modal-tip strong { font-weight: 600; }

  .section-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(61,43,31,0.4);
    margin-bottom: 12px;
  }

  /* INGREDIENTS */
  .ingredients {
    background: white;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 24px;
  }

  .ing-group { margin-bottom: 14px; }
  .ing-group:last-child { margin-bottom: 0; }

  .ing-group-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--rust);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .ing-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 0;
    border-bottom: 1px dashed rgba(61,43,31,0.08);
    font-size: 0.88rem;
  }

  .ing-row:last-child { border-bottom: none; }

  .ing-name { color: var(--brown); }

  .ing-amount {
    font-weight: 500;
    color: var(--rust);
    font-size: 0.82rem;
    text-align: right;
    min-width: 90px;
  }

  /* STEPS */
  .steps { list-style: none; }

  .step {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    align-items: flex-start;
  }

  .step-num {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--brown);
    color: var(--cream);
    font-size: 0.8rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .step-text {
    font-size: 0.9rem;
    line-height: 1.65;
    color: rgba(61,43,31,0.85);
  }

  .step-note {
    display: inline-block;
    background: #fef8ec;
    color: #a07a20;
    font-size: 0.78rem;
    padding: 2px 8px;
    border-radius: 6px;
    margin-top: 4px;
    font-style: italic;
  }

  /* ALT OPTION */
  .alt-option {
    background: var(--light-sage);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.83rem;
    color: #4a7a4e;
    margin-top: 14px;
  }

  .alt-option strong { font-weight: 600; }

  /* NO RESULTS */
  .no-results {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: rgba(61,43,31,0.35);
    font-size: 1rem;
  }

  .no-results span { font-size: 2rem; display: block; margin-bottom: 12px; }

  @media (max-width: 500px) {
    .modal-header, .modal-body { padding-left: 22px; padding-right: 22px; }
    .modal-header h2 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Our Recipe Book <span class="heart">♥</span></h1>
  <p>Korean & Western recipes, made together</p>
</header>

<div class="filter-bar">
  <span class="filter-label">Filter:</span>
  <button class="filter-btn active" onclick="filterRecipes('all', this)">All</button>
  <button class="filter-btn" onclick="filterRecipes('korean', this)">🇰🇷 Korean</button>
  <button class="filter-btn" onclick="filterRecipes('western', this)">🥖 Western</button>
  <button class="filter-btn" onclick="filterRecipes('baking', this)">🧁 Baking</button>
</div>

<div class="search-wrap">
  <input type="text" placeholder="🔍  Search recipes..." oninput="searchRecipes(this.value)" />
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
const recipes = [
  {

        { name: "Minced garlic", amount: "1 tbsp" },

      "Stir-fry for 1–2 minutes until the squid turns opaque. Don't overcook — it gets rubbery fast.",
      "Add sliced onion and green onion, then pour in the sauce. Toss everything together for another 1–2 minutes.",
      "Serve hot over white rice."

    alt: null
  },
  {
    id: 2,

    time: "20 min",
    difficulty: "Easy",
    tip: "Allulose is a low-calorie sweetener — you can swap it with the same amount of sugar or honey.",

      { group: "Sauce (per serving)", items: [
        { name: "Minced garlic", amount: "½ tsp (0.3 tbsp)" },

        { name: "Perilla oil (들기름)", amount: "½ tbsp" },
      ]},

        { name: "Parmesan or nori, to top", amount: "optional" },

    steps: [
      "Boil pasta in well-salted water according to package directions. Before draining, save ¼ cup of pasta water.",

  {

      ]}
    ],
    steps: [

      "Let cool for 5 minutes in the pan before turning out."
    ],
    alt: "No madeleine pan? Pour into a greased muffin tin and bake the same way — they'll taste identical, just rounder.",

    difficulty: "Easy",
    tip: "You've got two sauce options — both are delicious. The gochugaru version is spicier; the oyster sauce version is milder and savory.",

      { group: "Option A – Spicy Sauce", items: [
        { name: "Gochugaru (chili flakes)", amount: "2 tbsp" },
        { name: "Rice vinegar", amount: "2 tbsp" },

let activeFilter = 'all';
let searchQuery = '';

function filterRecipes(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function searchRecipes(q) {
  searchQuery = q.toLowerCase();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const filtered = recipes.filter(r => {
    const matchCat = activeFilter === 'all' || r.category === activeFilter;
    const matchSearch = !searchQuery ||
      r.name.toLowerCase().includes(searchQuery) ||
      (r.korean && r.korean.includes(searchQuery)) ||
      r.desc.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });

  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results"><span>🍽️</span>No recipes found. Try a different search!</div>';
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const tagClass = `tag-${r.category}`;
    const barClass = `bar-${r.category}`;
    const tagLabel = r.category === 'korean' ? '🇰🇷 Korean' : r.category === 'western' ? '🥖 Western' : '🧁 Baking';
    return `
      <div class="card" onclick="openModal(${r.id})">
        <div class="card-color ${barClass}"></div>
        <div class="card-body">
          <span class="card-tag ${tagClass}">${tagLabel}</span>
          <h2>${r.name}</h2>
          ${r.korean ? `<p style="font-size:0.8rem;color:rgba(61,43,31,0.4);margin-bottom:8px;font-style:italic;">${r.korean}</p>` : ''}
          <p class="desc">${r.desc}</p>
          <div class="card-meta">
            <span>⏱ ${r.time}</span>
            <span>📊 ${r.difficulty}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function openModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;

  const tagClass = `tag-${r.category}`;
  const tagLabel = r.category === 'korean' ? '🇰🇷 Korean' : r.category === 'western' ? '🥖 Western' : '🧁 Baking';

  const ingredientsHTML = r.ingredients.map(group => `
    <div class="ing-group">
      ${group.group !== 'Ingredients' ? `<div class="ing-group-label">${group.group}</div>` : ''}
      ${group.items.map(i => `
        <div class="ing-row">
          <span class="ing-name">${i.name}</span>
          <span class="ing-amount">${i.amount}</span>
        </div>
      `).join('')}
    </div>
  `).join('');

  const stepsHTML = r.steps.map((s, i) => {
    const note = r.stepNote && r.stepNote[i] ? `<div class="step-note">💡 ${r.stepNote[i]}</div>` : '';
    return `
      <li class="step">
        <div class="step-num">${i + 1}</div>
        <div class="step-text">${s}${note}</div>
      </li>
    `;
  }).join('');

  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <span class="card-tag tag ${tagClass}">${tagLabel}</span>
      <h2>${r.name}</h2>
      ${r.korean ? `<p class="korean-name">${r.korean}</p>` : ''}
      <button class="close-btn" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body">
      ${r.tip ? `<div class="modal-tip"><strong>💡 Before you start:</strong> ${r.tip}</div>` : ''}
      <div class="section-label">Ingredients</div>
      <div class="ingredients">${ingredientsHTML}</div>
      <div class="section-label">Steps</div>
      <ol class="steps">${stepsHTML}</ol>
      ${r.alt ? `<div class="alt-option"><strong>✨ Tip / Variation:</strong> ${r.alt}</div>` : ''}
    </div>
  `;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalDirect();
});

renderGrid();
</script>
