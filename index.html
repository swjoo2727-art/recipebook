<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Recipe Book 🍳</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#faf7f2; --warm-white:#fff9f0; --brown:#3d2b1f; --rust:#c4623a; --sage:#7a9e7e; --gold:#d4a853; --light-sage:#eef4ef; --light-rust:#fdf0ea; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--brown); min-height:100vh; }
  body.ko { font-family:'Noto Serif KR',serif; }
  header { background:var(--brown); padding:48px 24px 40px; text-align:center; position:relative; overflow:hidden; }
  header::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 30% 50%,rgba(196,98,58,.25) 0%,transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(122,158,126,.2) 0%,transparent 60%); }
  header h1 { font-family:'Playfair Display',serif; font-size:clamp(2.2rem,6vw,3.8rem); color:var(--cream); position:relative; letter-spacing:-0.5px; }
  body.ko header h1 { font-family:'Noto Serif KR',serif; }
  header p { font-size:.95rem; color:rgba(250,247,242,.6); margin-top:8px; font-weight:300; position:relative; }
  .heart { color:var(--rust); }
  .lang-toggle { position:absolute; top:20px; right:20px; display:flex; background:rgba(255,255,255,.1); border-radius:100px; padding:3px; gap:2px; z-index:10; }
  .lang-btn { padding:6px 14px; border-radius:100px; border:none; background:transparent; color:rgba(250,247,242,.6); font-size:.82rem; font-weight:500; cursor:pointer; transition:all .2s; font-family:'DM Sans',sans-serif; }
  .lang-btn.active { background:rgba(255,255,255,.2); color:var(--cream); }
  .filter-bar { display:flex; gap:10px; padding:24px 24px 0; flex-wrap:wrap; max-width:1100px; margin:0 auto; align-items:center; }
  .filter-label { font-size:.78rem; font-weight:500; text-transform:uppercase; letter-spacing:1px; color:var(--brown); opacity:.5; margin-right:4px; }
  .filter-btn { padding:7px 18px; border-radius:100px; border:1.5px solid var(--brown); background:transparent; font-family:inherit; font-size:.85rem; font-weight:500; color:var(--brown); cursor:pointer; transition:all .2s; opacity:.5; }
  .filter-btn:hover { opacity:1; }
  .filter-btn.active { background:var(--brown); color:var(--cream); opacity:1; }
  .search-wrap { max-width:1100px; margin:16px auto 0; padding:0 24px; }
  .search-wrap input { width:100%; max-width:360px; padding:10px 18px; border-radius:100px; border:1.5px solid rgba(61,43,31,.2); background:white; font-family:inherit; font-size:.9rem; color:var(--brown); outline:none; transition:border-color .2s; }
  .search-wrap input:focus { border-color:var(--rust); }
  .search-wrap input::placeholder { color:rgba(61,43,31,.35); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:24px; max-width:1100px; margin:28px auto 60px; padding:0 24px; }
  .card { background:white; border-radius:20px; overflow:hidden; cursor:pointer; transition:transform .25s,box-shadow .25s; box-shadow:0 2px 12px rgba(61,43,31,.07); border:1px solid rgba(61,43,31,.06); }
  .card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(61,43,31,.13); }
  .card-color { height:8px; }
  .card-body { padding:22px 24px 20px; }
  .card-tag { display:inline-block; font-size:.7rem; font-weight:500; text-transform:uppercase; letter-spacing:1px; padding:3px 10px; border-radius:100px; margin-bottom:10px; }
  .tag-korean { background:var(--light-rust); color:var(--rust); }
  .tag-western { background:var(--light-sage); color:#4a7a4e; }
  .tag-baking { background:#fef8ec; color:#a07a20; }
  .bar-korean { background:var(--rust); }
  .bar-western { background:var(--sage); }
  .bar-baking { background:var(--gold); }
  .card h2 { font-family:'Playfair Display',serif; font-size:1.25rem; font-weight:700; margin-bottom:8px; line-height:1.3; }
  body.ko .card h2 { font-family:'Noto Serif KR',serif; }
  .card p.desc { font-size:.85rem; color:rgba(61,43,31,.55); line-height:1.5; margin-bottom:14px; }
  .card-meta { display:flex; gap:14px; font-size:.78rem; color:rgba(61,43,31,.45); }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(30,18,10,.55); backdrop-filter:blur(4px); z-index:100; padding:20px; overflow-y:auto; align-items:flex-start; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--warm-white); border-radius:24px; max-width:640px; width:100%; margin:auto; overflow:hidden; box-shadow:0 32px 80px rgba(30,18,10,.25); animation:slideUp .3s ease; }
  @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal-header { padding:32px 36px 24px; border-bottom:1px solid rgba(61,43,31,.08); position:relative; }
  .modal-header h2 { font-family:'Playfair Display',serif; font-size:1.9rem; line-height:1.25; }
  body.ko .modal-header h2 { font-family:'Noto Serif KR',serif; }
  .modal-header .sub-name { font-size:.9rem; color:rgba(61,43,31,.45); margin-top:4px; font-style:italic; }
  .close-btn { position:absolute; top:24px; right:24px; width:36px; height:36px; border-radius:50%; border:none; background:rgba(61,43,31,.08); color:var(--brown); font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s; }
  .close-btn:hover { background:rgba(61,43,31,.15); }
  .modal-body { padding:28px 36px 36px; }
  .modal-tip { background:var(--light-rust); border-radius:12px; padding:12px 16px; font-size:.83rem; color:var(--rust); margin-bottom:24px; line-height:1.5; }
  .modal-tip strong { font-weight:600; }
  .section-label { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:1.5px; color:rgba(61,43,31,.4); margin-bottom:12px; }
  .ingredients { background:white; border-radius:14px; padding:18px 20px; margin-bottom:24px; }
  .ing-group { margin-bottom:14px; }
  .ing-group:last-child { margin-bottom:0; }
  .ing-group-label { font-size:.78rem; font-weight:600; color:var(--rust); text-transform:uppercase; letter-spacing:.8px; margin-bottom:8px; }
  .ing-row { display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; border-bottom:1px dashed rgba(61,43,31,.08); font-size:.88rem; }
  .ing-row:last-child { border-bottom:none; }
  .ing-name { color:var(--brown); }
  .ing-amount { font-weight:500; color:var(--rust); font-size:.82rem; text-align:right; min-width:90px; }
  .steps { list-style:none; }
  .step { display:flex; gap:16px; margin-bottom:16px; align-items:flex-start; }
  .step-num { flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--brown); color:var(--cream); font-size:.8rem; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .step-text { font-size:.9rem; line-height:1.65; color:rgba(61,43,31,.85); }
  .alt-option { background:var(--light-sage); border-radius:10px; padding:10px 14px; font-size:.83rem; color:#4a7a4e; margin-top:14px; }
  .alt-option strong { font-weight:600; }
  .no-results { grid-column:1/-1; text-align:center; padding:60px 20px; color:rgba(61,43,31,.35); font-size:1rem; }
  .no-results span { font-size:2rem; display:block; margin-bottom:12px; }
  @media(max-width:500px){ .modal-header,.modal-body{padding-left:22px;padding-right:22px} .modal-header h2{font-size:1.5rem} }
</style>
</head>
<body>
<header>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
    <button class="lang-btn" onclick="setLang('ko',this)">한국어</button>
  </div>
  <h1 id="header-title">Our Recipe Book <span class="heart">♥</span></h1>
  <p id="header-sub">Korean &amp; Western recipes, made together</p>
</header>
<div class="filter-bar">
  <span class="filter-label" id="filter-label">Filter:</span>
  <button class="filter-btn active" id="btn-all" onclick="filterRecipes('all',this)">All</button>
  <button class="filter-btn" id="btn-korean" onclick="filterRecipes('korean',this)">🇰🇷 Korean</button>
  <button class="filter-btn" id="btn-western" onclick="filterRecipes('western',this)">🥖 Western</button>
  <button class="filter-btn" id="btn-baking" onclick="filterRecipes('baking',this)">🧁 Baking</button>
</div>
<div class="search-wrap"><input id="search-input" type="text" placeholder="🔍  Search recipes..." oninput="searchRecipes(this.value)"/></div>
<div class="grid" id="grid"></div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)"><div class="modal" id="modal"></div></div>
<script>
let lang='en';
const ui={
  en:{title:'Our Recipe Book <span class="heart">♥</span>',sub:'Korean & Western recipes, made together',filterLabel:'Filter:',all:'All',korean:'🇰🇷 Korean',western:'🥖 Western',baking:'🧁 Baking',search:'🔍  Search recipes...',noResults:'No recipes found. Try a different search!',beforeStart:'💡 Before you start:',ingredients:'Ingredients',steps:'Steps',tipVariation:'✨ Tip / Variation:'},
  ko:{title:'우리의 레시피북 <span class="heart">♥</span>',sub:'함께 만드는 한식 & 양식 레시피',filterLabel:'분류:',all:'전체',korean:'🇰🇷 한식',western:'🥖 양식',baking:'🧁 베이킹',search:'🔍  레시피 검색...',noResults:'레시피를 찾을 수 없어요. 다른 검색어를 써봐요!',beforeStart:'💡 시작 전 참고:',ingredients:'재료',steps:'만드는 법',tipVariation:'✨ 팁 / 변형:'}
};
const recipes=[
  {id:1,category:'korean',
   en:{name:'Spicy Squid Stir-Fry',cat:'🇰🇷 Korean',desc:'A classic Korean stir-fry with a bold, spicy-savory sauce. Great over rice.',time:'20 min',diff:'Easy',tip:'This is just the sauce — pair it with 1 lb (450g) of cleaned squid sliced into rings, stir-fried with onion and green onion.',ingredients:[{group:'Sauce',items:[{name:'Gochujang (Korean chili paste)',amount:'1 tbsp'},{name:'Gochugaru (Korean chili flakes)',amount:'1½ tbsp'},{name:'Soy sauce',amount:'2 tbsp'},{name:'Minced garlic',amount:'1 tbsp'},{name:'Allulose (or sugar)',amount:'1 tbsp'}]}],steps:['Mix all sauce ingredients in a small bowl. Set aside.','Clean squid, cut body into rings, leave tentacles whole. Pat very dry with paper towels — this helps it sear instead of steam.','Heat a large pan over high heat with a splash of oil. When shimmering hot, add squid.','Stir-fry 1–2 min until opaque. Don\'t overcook — squid gets rubbery fast.','Add sliced onion and green onion, pour in sauce. Toss everything together 1–2 more minutes.','Serve hot over white rice.'],alt:null},
   ko:{name:'오징어볶음',cat:'🇰🇷 한식',desc:'진하고 칼칼한 양념의 클래식 오징어볶음. 밥 도둑 그 자체.',time:'20분',diff:'쉬움',tip:'이건 양념 레시피예요. 손질한 오징어 약 450g에 양파, 대파를 함께 볶으면 돼요.',ingredients:[{group:'양념',items:[{name:'고추장',amount:'1 큰술'},{name:'고춧가루',amount:'1½ 큰술'},{name:'양조간장',amount:'2 큰술'},{name:'다진마늘',amount:'1 큰술'},{name:'알룰로스 (또는 설탕)',amount:'1 큰술'}]}],steps:['양념 재료를 모두 섞어요.','오징어를 손질해 몸통은 링으로 썰고 다리는 그대로 두세요. 키친타올로 꼭꼭 눌러 물기를 제거해요.','팬을 강불에 달구고 기름을 두른 뒤 오징어를 넣어요.','1~2분 볶아 색이 하얗게 변하면 돼요. 너무 오래 볶으면 질겨져요!','양파, 대파를 넣고 양념을 부어 1~2분 더 볶아요.','따뜻한 밥 위에 올려 바로 드세요.'],alt:null}
  },
  {id:2,category:'korean',
   en:{name:'Perilla Pasta',cat:'🇰🇷 Korean',desc:'A nutty, earthy Korean-style pasta with perilla oil and umami-rich tsuyu.',time:'20 min',diff:'Easy',tip:'Perilla oil (들기름) has a unique nutty aroma — don\'t swap for sesame oil, they taste very different! Allulose can be replaced with sugar or honey.',ingredients:[{group:'Sauce (per serving)',items:[{name:'Minced garlic',amount:'½ tsp'},{name:'Tsuyu (Japanese dashi soy sauce)',amount:'½ tbsp'},{name:'Allulose (or sugar)',amount:'½ tbsp'},{name:'Perilla oil (들기름)',amount:'½ tbsp'}]},{group:'Also needed',items:[{name:'Pasta (spaghetti or linguine)',amount:'80g per person'},{name:'Perilla leaves (깻잎), thinly sliced',amount:'a handful'},{name:'Parmesan or crumbled nori',amount:'optional'}]}],steps:['Boil pasta in well-salted water according to package. Before draining, save ¼ cup of pasta water.','Mix all sauce ingredients together in your serving bowl.','Drain pasta and toss directly in the sauce bowl. Add a splash of pasta water if it looks dry.','Top with thinly sliced perilla leaves and parmesan or nori.','Eat immediately — the garlic aroma fades fast!'],alt:null},
   ko:{name:'들깨파스타',cat:'🇰🇷 한식',desc:'들기름과 쯔유의 조합으로 만드는 고소하고 감칠맛 나는 파스타.',time:'20분',diff:'쉬움',tip:'들기름은 참기름과 향이 달라요 — 꼭 들기름으로 만들어야 제맛! 알룰로스는 설탕이나 꿀로 대체 가능해요.',ingredients:[{group:'양념 (1인분)',items:[{name:'다진마늘',amount:'½ 작은술'},{name:'쯔유',amount:'½ 큰술'},{name:'알룰로스 (또는 설탕)',amount:'½ 큰술'},{name:'들기름',amount:'½ 큰술'}]},{group:'필요한 재료',items:[{name:'파스타 (스파게티 또는 링귀니)',amount:'1인당 80g'},{name:'깻잎, 채썬 것',amount:'한 줌'},{name:'파마산 치즈 또는 김가루',amount:'선택'}]}],steps:['소금 넣은 물에 파스타를 삶아요. 건지기 전에 면수 ¼컵을 꼭 덜어두세요.','서빙 그릇에 양념 재료를 모두 섞어요.','파스타를 건져 바로 그릇에 넣고 버무려요. 건조하면 면수를 조금 추가해요.','채썬 깻잎과 파마산 치즈 또는 김가루를 올려요.','마늘 향이 금방 날아가니 바로 드세요!'],alt:null}
  },
  {id:3,category:'baking',
   en:{name:'Chocolate Sweet Potato Madeleines',cat:'🧁 Baking',desc:'Moist, fudgy mini cakes made with sweet potato and cocoa. Naturally gluten-free.',time:'25 min',diff:'Easy',tip:'Grease the madeleine pan very well, or use a silicone mold. These are naturally gluten-free since there\'s no flour!',ingredients:[{group:'Batter',items:[{name:'Allulose (or sugar)',amount:'21g'},{name:'Cooked sweet potato, mashed',amount:'40g'},{name:'Egg',amount:'1 large'},{name:'Cocoa powder, unsweetened',amount:'10g'},{name:'Baking powder',amount:'a pinch'}]}],steps:['Preheat oven to 375°F (190°C). Grease a madeleine pan generously with butter or cooking spray.','Combine mashed sweet potato, egg, and allulose. Mix until smooth.','Sift in cocoa powder and baking powder. Stir until just combined — don\'t overmix.','Spoon into madeleine molds, filling each about ¾ full.','Bake 10–12 min until a toothpick inserted in the center comes out clean.','Cool 5 min in the pan before turning out.'],alt:'No madeleine pan? Use a greased muffin tin — same bake time, just rounder!'},
   ko:{name:'초코마들렌',cat:'🧁 베이킹',desc:'고구마와 코코아로 만드는 촉촉하고 진한 미니 케이크. 글루텐프리.',time:'25분',diff:'쉬움',tip:'마들렌 틀에 버터를 충분히 바르거나 실리콘 틀을 써요. 밀가루가 없어서 자연스럽게 글루텐프리예요!',ingredients:[{group:'반죽',items:[{name:'알룰로스 (또는 설탕)',amount:'21g'},{name:'익힌 고구마, 으깬 것',amount:'40g'},{name:'달걀',amount:'1개'},{name:'코코아파우더 (무가당)',amount:'10g'},{name:'베이킹파우더',amount:'한 꼬집'}]}],steps:['오븐을 375°F (190°C)로 예열하고 마들렌 틀에 버터를 넉넉히 발라요.','으깬 고구마, 달걀, 알룰로스를 부드럽게 섞어요.','코코아파우더와 베이킹파우더를 체에 내려 넣고 살살 섞어요.','틀에 반죽을 ¾ 정도 채워요.','10~12분 굽고 이쑤시개를 찔러 깨끗이 나오면 완성이에요.','5분 식힌 후 틀에서 빼요.'],alt:'마들렌 틀이 없으면 머핀 틀에 구워도 돼요 — 굽는 시간은 동일해요!'}
  },
  {id:4,category:'korean',
   en:{name:'Cabbage Tuna Rice Bowl',cat:'🇰🇷 Korean',desc:'A quick, filling rice bowl with spicy-tangy tuna and crunchy cabbage.',time:'15 min',diff:'Easy',tip:'Two sauce options! The gochugaru version is spicy and tangy; the oyster sauce version is milder and savory.',ingredients:[{group:'Option A – Spicy',items:[{name:'Gochugaru (chili flakes)',amount:'2 tbsp'},{name:'Rice vinegar',amount:'2 tbsp'},{name:'Minced garlic',amount:'½ tbsp'},{name:'Allulose (or sugar)',amount:'1 tbsp'},{name:'Soy sauce',amount:'1 tbsp'}]},{group:'Option B – Savory',items:[{name:'Oyster sauce',amount:'1 tbsp'},{name:'Tuna fish sauce (참치액)',amount:'1 tbsp'}]},{group:'Base',items:[{name:'Canned tuna, drained',amount:'1 can (165g)'},{name:'Shredded cabbage',amount:'2 big handfuls'},{name:'Steamed white rice',amount:'1 bowl'},{name:'Sesame oil',amount:'1 tbsp'}]}],steps:['Cook or reheat rice. Drizzle with sesame oil and stir to coat.','Drain canned tuna very well. Mix with your chosen sauce.','Lay shredded cabbage over the rice. Spoon sauced tuna on top.','Drizzle a little extra sesame oil or sesame seeds if you like.','Mix everything together before eating!'],alt:null},
   ko:{name:'양배추참치덮밥',cat:'🇰🇷 한식',desc:'칼칼하고 새콤한 참치와 아삭한 양배추가 올라간 든든한 덮밥.',time:'15분',diff:'쉬움',tip:'소스는 두 가지 중 하나를 골라요. 고춧가루 버전은 칼칼하고 새콤하고, 굴소스 버전은 담백해요.',ingredients:[{group:'소스 A – 칼칼한 맛',items:[{name:'고춧가루',amount:'2 큰술'},{name:'식초',amount:'2 큰술'},{name:'다진마늘',amount:'½ 큰술'},{name:'알룰로스 (또는 설탕)',amount:'1 큰술'},{name:'간장',amount:'1 큰술'}]},{group:'소스 B – 감칠맛',items:[{name:'굴소스',amount:'1 큰술'},{name:'참치액',amount:'1 큰술'}]},{group:'기본 재료',items:[{name:'캔 참치, 물기 뺀 것',amount:'1캔 (165g)'},{name:'양배추, 채썬 것',amount:'두 줌'},{name:'따뜻한 밥',amount:'1공기'},{name:'참기름',amount:'1 큰술'}]}],steps:['밥을 짓거나 데워요. 참기름 1 큰술을 넣고 섞어요.','참치의 물기를 충분히 빼고 선택한 소스와 섞어요.','밥 위에 양배추를 깔고 참치를 올려요.','참기름이나 통깨를 조금 더 뿌려요.','먹기 전에 쓱쓱 비벼서 드세요!'],alt:null}
  },
  {id:5,category:'korean',
   en:{name:'Dak Galbi Marinade',cat:'🇰🇷 Korean',desc:'The famous Chuncheon-style spicy stir-fried chicken marinade.',time:'30 min + marinating',diff:'Easy',tip:'Marinate 600–800g boneless chicken thighs for at least 30 min — overnight is even better. Cook with cabbage, sweet potato, and green onion!',ingredients:[{group:'Marinade',items:[{name:'Gochujang (chili paste)',amount:'3 tbsp'},{name:'Gochugaru (chili flakes)',amount:'3 tbsp'},{name:'Minced garlic',amount:'3 tbsp'},{name:'Soy sauce',amount:'3 tbsp'},{name:'Mirin',amount:'3 tbsp'},{name:'Allulose (or sugar)',amount:'3 tbsp'}]}],steps:['Cut boneless chicken thighs into bite-sized chunks (about 3–4cm).','Mix all marinade ingredients together. Add chicken and toss until fully coated.','Cover and refrigerate at least 30 min — overnight is best.','Heat a large pan over medium-high heat with a little oil.','Cook chicken 8–10 min until cooked through and slightly caramelized.','Add cabbage, sweet potato slices, and green onion in the last few minutes. Cook until soft.','Serve with rice, or wrap in perilla leaves if you have them!'],alt:null},
   ko:{name:'닭갈비 양념',cat:'🇰🇷 한식',desc:'춘천식 매콤달콤 닭갈비 양념. 밥이랑 먹으면 최고.',time:'30분 + 재우기',diff:'쉬움',tip:'뼈 없는 닭다리살 600~800g을 최소 30분 재워요. 하룻밤 재우면 더 깊은 맛이 나요. 양배추, 고구마, 대파와 함께 볶아요!',ingredients:[{group:'양념',items:[{name:'고추장',amount:'3 큰술'},{name:'고춧가루',amount:'3 큰술'},{name:'다진마늘',amount:'3 큰술'},{name:'간장',amount:'3 큰술'},{name:'맛술 (미림)',amount:'3 큰술'},{name:'알룰로스 (또는 설탕)',amount:'3 큰술'}]}],steps:['닭다리살을 한입 크기(3~4cm)로 썰어요.','양념 재료를 모두 섞고 닭에 골고루 버무려요.','뚜껑 덮고 냉장고에서 최소 30분 재워요.','팬을 중강불로 달구고 기름을 조금 두른 뒤 닭을 넣어요.','8~10분 볶아 속까지 익히고 살짝 캐러멜라이즈될 때까지 익혀요.','마지막에 양배추, 고구마 슬라이스, 대파를 넣고 볶아요.','밥이랑 함께 깻잎에 싸서 드세요!'],alt:null}
  },
  {id:6,category:'korean',
   en:{name:'Tangy Garlic Chive Salad',cat:'🇰🇷 Korean',desc:'A bright, garlicky Korean chive side dish that balances any heavy main.',time:'10 min',diff:'Easy',tip:'Korean chives (부추) look like thin flat grass. Can\'t find them? Green onion tops work. Maesil (매실액) is plum extract — sub with rice vinegar + a little sugar.',ingredients:[{group:'Dressing',items:[{name:'Minced garlic',amount:'½ tbsp'},{name:'Gochugaru (chili flakes)',amount:'3 tbsp'},{name:'Maesil (plum extract)',amount:'2 tbsp'},{name:'Fish sauce (까나리액젓)',amount:'2 tbsp'},{name:'Rice vinegar',amount:'1 tbsp'},{name:'Sesame oil',amount:'1 tbsp'},{name:'Sesame seeds',amount:'a sprinkle'}]},{group:'Produce',items:[{name:'Korean chives (부추), cut into 3-inch pieces',amount:'1 bunch'}]}],steps:['Rinse chives and cut into 3-inch (8cm) segments.','Combine all dressing ingredients in a mixing bowl and stir.','Add chives and toss gently until evenly coated.','Taste and adjust — more vinegar for tangier, more maesil for sweeter.','Serve immediately as a side dish (banchan) with rice.'],alt:null},
   ko:{name:'새콤한 부추무침',cat:'🇰🇷 한식',desc:'새콤달콤하고 마늘 향 솔솔한 부추무침. 어떤 메인 요리에도 잘 어울리는 밑반찬.',time:'10분',diff:'쉬움',tip:'부추가 없으면 대파 초록 부분으로 대체 가능해요. 매실액이 없으면 식초 + 설탕 조금으로 대체해요.',ingredients:[{group:'양념',items:[{name:'다진마늘',amount:'½ 큰술'},{name:'고춧가루',amount:'3 큰술'},{name:'매실액',amount:'2 큰술'},{name:'까나리액젓',amount:'2 큰술'},{name:'식초',amount:'1 큰술'},{name:'참기름',amount:'1 큰술'},{name:'통깨',amount:'약간'}]},{group:'채소',items:[{name:'부추, 5cm 길이로 썬 것',amount:'한 단'}]}],steps:['부추를 깨끗이 씻고 5cm 길이로 잘라요.','양념 재료를 모두 섞어요.','부추를 넣고 살살 버무려요.','맛을 보고 조절해요 — 더 새콤하면 식초, 더 달면 매실액을 추가해요.','바로 밥반찬으로 내요.'],alt:null}
  },
  {id:7,category:'korean',
   en:{name:'Low-Cal Spicy Rice Cakes',cat:'🇰🇷 Korean',desc:'A guilt-free Yeopgi tteokbokki-inspired dish wrapped in rice paper.',time:'25 min',diff:'Medium',tip:'Inspired by Yeopgi tteokbokki\'s sweet-spicy-savory sauce, but wrapped in rice paper to keep it low-calorie instead of using rice cakes.',ingredients:[{group:'Sauce',items:[{name:'Gochugaru (chili flakes)',amount:'2 tbsp'},{name:'Olive oil',amount:'1 tbsp'},{name:'Allulose (or sugar)',amount:'1 tbsp'},{name:'Minced garlic',amount:'½ tbsp'},{name:'Gochujang (chili paste)',amount:'½ tbsp'},{name:'Oyster sauce',amount:'½ tbsp'},{name:'Soy sauce',amount:'½ tbsp'},{name:'Black pepper',amount:'½ tsp'},{name:'Tuna fish sauce (참치액)',amount:'1 tbsp'}]},{group:'Filling & Wrap',items:[{name:'Shredded cabbage',amount:'2 big handfuls'},{name:'Chicken breast',amount:'1 piece'},{name:'Water',amount:'2 cups'},{name:'Round rice paper (bánh tráng)',amount:'as needed'},{name:'String cheese sticks',amount:'as needed'}]}],steps:['Mix all sauce ingredients together in a small bowl.','Add cabbage and chicken breast with 2 cups of water to a pan. Bring to a boil over medium-high heat.','Pour in the sauce. Simmer 5–7 min until liquid reduces and chicken is cooked through.','Dip a rice paper sheet in warm water for 5–10 seconds until just pliable. Lay flat on a damp surface.','Place a string cheese strip in the center. Spoon saucy cabbage-chicken mixture on top.','Fold in the sides and roll up tightly like a burrito. Repeat with remaining rice papers.','Eat immediately — rice paper gets sticky fast!'],alt:null},
   ko:{name:'유지만 엽떡',cat:'🇰🇷 한식',desc:'엽기떡볶이 스타일 소스를 라이스페이퍼로 감싼 저칼로리 버전.',time:'25분',diff:'보통',tip:'소스는 엽기떡볶이 맛에서 영감을 받았어요. 라이스페이퍼로 감싸면 떡 없이도 비슷한 느낌을 낼 수 있어요!',ingredients:[{group:'소스',items:[{name:'고춧가루',amount:'2 큰술'},{name:'올리브오일',amount:'1 큰술'},{name:'알룰로스 (또는 설탕)',amount:'1 큰술'},{name:'다진마늘',amount:'½ 큰술'},{name:'고추장',amount:'½ 큰술'},{name:'굴소스',amount:'½ 큰술'},{name:'간장',amount:'½ 큰술'},{name:'후추',amount:'½ 작은술'},{name:'참치액',amount:'1 큰술'}]},{group:'속재료 & 포장',items:[{name:'양배추, 채썬 것',amount:'두 줌'},{name:'닭가슴살',amount:'1쪽'},{name:'물',amount:'2컵'},{name:'원형 라이스페이퍼',amount:'필요한 만큼'},{name:'스트링치즈',amount:'필요한 만큼'}]}],steps:['소스 재료를 모두 섞어요.','팬에 양배추, 닭가슴살, 물 2컵을 넣고 끓여요.','소스를 부어 5~7분 졸여요.','라이스페이퍼를 따뜻한 물에 5~10초 담가 부드럽게 해요.','스트링치즈를 중앙에 놓고 소스 버무린 재료를 올려요.','옆면을 접고 단단히 말아요.','바로 드세요 — 라이스페이퍼는 금방 달라붙어요!'],alt:null}
  },
  {id:8,category:'korean',
   en:{name:'Braised Spicy Tofu',cat:'🇰🇷 Korean',desc:'Silky tofu simmered in a savory, lightly spicy soy broth. A weeknight staple.',time:'20 min',diff:'Easy',tip:'Use firm tofu and pat it very dry before pan-frying — you want a golden crust. Cheongyang chili (청양고추) is very spicy — use half or skip if sensitive to heat.',ingredients:[{group:'Sauce',items:[{name:'Soy sauce (진간장)',amount:'3 tbsp'},{name:'Mirin',amount:'2 tbsp'},{name:'Tuna fish sauce (참치액)',amount:'1 tbsp'},{name:'Minced garlic',amount:'1 tbsp'},{name:'Allulose (or sugar)',amount:'2 tbsp'},{name:'Gochugaru (chili flakes)',amount:'2 tbsp'},{name:'Black pepper',amount:'a pinch'},{name:'Water',amount:'¾ cup (200ml)'}]},{group:'Protein & Produce',items:[{name:'Firm tofu',amount:'1 block (300g)'},{name:'Cheongyang chili, sliced (optional)',amount:'1'},{name:'Green onion, chopped',amount:'1 stalk'}]}],steps:['Drain tofu and press dry with paper towels. Slice into ½-inch (1cm) thick rectangles.','Pan-fry tofu in a little oil over medium-high heat, 2–3 min per side until golden. Set aside.','In the same pan, combine all sauce ingredients and bring to a boil.','Add tofu back in. Spoon sauce over each piece to coat.','Add chili and green onion. Simmer on medium-low 5–7 min, spooning sauce over tofu, until sauce thickens.','Serve over rice with sauce drizzled on top.'],alt:null},
   ko:{name:'두부조림',cat:'🇰🇷 한식',desc:'부드러운 두부를 짭조름하고 칼칼한 양념장에 조린 밥반찬.',time:'20분',diff:'쉬움',tip:'단단한 두부를 써야 모양이 잘 유지돼요. 굽기 전에 키친타올로 물기를 충분히 제거해야 노릇하게 구워져요.',ingredients:[{group:'양념',items:[{name:'진간장',amount:'3 큰술'},{name:'미림',amount:'2 큰술'},{name:'참치액',amount:'1 큰술'},{name:'다진마늘',amount:'1 큰술'},{name:'알룰로스 (또는 설탕)',amount:'2 큰술'},{name:'고춧가루',amount:'2 큰술'},{name:'후추',amount:'약간'},{name:'물',amount:'200ml'}]},{group:'단백질 & 채소',items:[{name:'두부 (단단한 것)',amount:'1모 (300g)'},{name:'청양고추, 송송 썬 것',amount:'1개'},{name:'대파, 송송 썬 것',amount:'1대'}]}],steps:['두부를 키친타올로 눌러 물기를 빼요. 두께 1cm 정도로 썰어요.','팬에 기름을 두르고 중강불에서 양면 2~3분씩 노릇하게 구워요.','같은 팬에 양념 재료를 넣고 끓여요.','구운 두부를 다시 넣고 양념을 끼얹어줘요.','청양고추, 대파 넣고 중약불에서 5~7분 조려요.','밥 위에 올리고 양념을 뿌려 내요.'],alt:null}
  },
  {id:9,category:'western',
   en:{name:'Pretty Toast',cat:'🥖 Western',desc:'A café-style aesthetic toast with whipped ricotta, cherry jam, and honey.',time:'5 min',diff:'Easy',tip:'The key to looking "pretty": layer generously and finish with lime zest — that bright green pop makes everything look fancy and tastes incredible.',ingredients:[{group:'Ingredients',items:[{name:'Sourdough bread, thick-sliced',amount:'1–2 slices'},{name:'Ricotta cheese',amount:'3–4 tbsp'},{name:'Lime zest',amount:'from ½ lime'},{name:'Cherry jam',amount:'1–2 tbsp'},{name:'Good honey (like Beehill)',amount:'1 tbsp'},{name:'Extra lime for zesting',amount:'½'}]}],steps:['Toast sourdough until golden and crispy.','Mix ricotta with lime zest until fluffy. This is your lime whip.','Spread the lime whip generously over warm toast.','Spoon cherry jam on top.','Drizzle honey over everything.','Zest a little more lime directly on top for color and aroma. Serve right away!'],alt:null},
   ko:{name:'예쁜 토스트',cat:'🥖 양식',desc:'리코타 치즈, 체리잼, 꿀을 올린 카페 스타일 토스트.',time:'5분',diff:'쉬움',tip:'예쁘게 만드는 비결은 재료를 넉넉하게 올리고 마지막에 라임 제스트로 마무리하는 거예요!',ingredients:[{group:'재료',items:[{name:'사워도우 식빵, 두꺼운 것',amount:'1~2장'},{name:'리코타 치즈',amount:'3~4 큰술'},{name:'라임 제스트',amount:'½개 분량'},{name:'체리잼',amount:'1~2 큰술'},{name:'좋은 꿀 (비힐 등)',amount:'1 큰술'},{name:'라임 (제스트용 추가)',amount:'½개'}]}],steps:['사워도우를 노릇하게 토스트해요.','리코타에 라임 제스트를 넣고 섞어요. 이게 라임 휩이에요.','따뜻한 토스트에 라임 휩을 듬뿍 발라요.','체리잼을 올려요.','꿀을 골고루 뿌려요.','라임을 한번 더 갈아 올려요. 바로 드세요!'],alt:null}
  },
  {id:10,category:'baking',
   en:{name:'Basque Cheesecake',cat:'🧁 Baking',desc:'A burnished, creamy Basque-style cheesecake. No crust, no water bath, no fuss.',time:'45 min + 12hr chilling',diff:'Medium',tip:'All dairy must be at room temperature — cold cream cheese creates lumps that won\'t bake out. Take everything out of the fridge 1–2 hours before starting.',ingredients:[{group:'Batter',items:[{name:'Cream cheese, room temp',amount:'400g'},{name:'Sugar',amount:'90g'},{name:'Eggs, room temp, beaten',amount:'120g (~2 large)'},{name:'Heavy cream, room temp',amount:'200g'},{name:'Vanilla extract',amount:'2g (½ tsp)'}]}],steps:['Preheat oven to 390°F (200°C). Line a 7-inch round pan with parchment paper, letting it come up the sides.','Beat cream cheese until completely smooth and lump-free.','Add sugar and mix until dissolved, about 2 minutes.','Add beaten eggs in two batches, mixing gently between each addition.','Add heavy cream and vanilla. Stir with a spatula kept in contact with the bottom — don\'t whisk air in.','Pour into pan. Bake 30 min until deeply golden-brown on top and jiggly in the center.','Cool completely at room temp. Refrigerate at least 12 hours before slicing.'],alt:null},
   ko:{name:'바스크 치즈케이크',cat:'🧁 베이킹',desc:'크러스트도 중탕도 없는 진하고 부드러운 바스크 치즈케이크.',time:'45분 + 12시간 냉장',diff:'보통',tip:'모든 유제품은 반드시 상온으로 맞춰야 해요! 차가운 크림치즈는 덩어리가 생겨요. 굽기 1~2시간 전에 냉장고에서 꺼내두세요.',ingredients:[{group:'반죽',items:[{name:'크림치즈, 상온',amount:'400g'},{name:'설탕',amount:'90g'},{name:'달걀, 상온, 풀어둔 것',amount:'120g (~2개)'},{name:'생크림, 상온',amount:'200g'},{name:'바닐라 익스트랙',amount:'2g (½ 작은술)'}]}],steps:['오븐을 390°F (200°C)로 예열해요. 7인치 원형 틀에 유산지를 깔되 옆면까지 올라오게 해요.','크림치즈를 완전히 매끄럽게 풀어요.','설탕을 넣고 녹을 때까지 2분간 섞어요.','달걀물을 두 번에 나눠 넣고 부드럽게 섞어요.','생크림과 바닐라를 넣고 주걱 끝을 바닥에 닿게 해서 섞어요. 공기가 들어가지 않게 해요.','틀에 붓고 30분 구워요. 윗면이 진한 갈색이고 중앙이 출렁이면 완성이에요.','실온에서 완전히 식힌 뒤 최소 12시간 냉장해요.'],alt:null}
  },
  {id:11,category:'baking',
   en:{name:"Biscoff S'mores Cookies",cat:'🧁 Baking',desc:'Chewy cookies with crushed Biscoff and a gooey frozen marshmallow center.',time:'30 min + 1hr chill',diff:'Medium',tip:'Freeze marshmallows at least 1 hour before baking so they stay gooey inside instead of dissolving completely. Slightly underbaked = best texture!',ingredients:[{group:'Dough (makes ~10)',items:[{name:'Unsalted butter, room temp',amount:'120g'},{name:'White sugar',amount:'60g'},{name:'Brown sugar, packed',amount:'60g'},{name:'Salt',amount:'2g'},{name:'Egg, room temp',amount:'1 large'},{name:'Vanilla extract',amount:'1 tsp'},{name:'All-purpose flour',amount:'190g'},{name:'Baking soda',amount:'2g'},{name:'Cinnamon powder',amount:'2g'},{name:'Lotus Biscoff cookies',amount:'22 total'},{name:'Marshmallows, frozen',amount:'10 large'}]}],steps:['Put marshmallows in freezer at least 1 hour before baking.','Beat butter until creamy. Add both sugars, beat until light and fluffy, about 2 min.','Add egg, salt, and vanilla. Mix until combined.','Whisk flour, cinnamon, and baking soda together. Sift into the butter mixture.','Crush 12 Biscoff cookies into crumbs. Fold into dough. Mix until just combined.','Wrap in plastic wrap and refrigerate 1 hour.','Preheat oven to 340°F (170°C). Line a baking sheet with parchment.','Divide into 10 balls. Flatten each, press a frozen marshmallow in the center, seal dough around it.','Place on baking sheet 2 inches apart. Press 1 whole Biscoff cookie on top of each.','Bake 12 min. They look underdone — that\'s correct! Rest 10 min on the pan before moving.'],alt:null},
   ko:{name:'비스코프 스모어 쿠키',cat:'🧁 베이킹',desc:'부순 비스코프와 녹진한 냉동 마시멜로가 숨어있는 쫄깃한 쿠키.',time:'30분 + 1시간 냉장',diff:'보통',tip:'마시멜로는 최소 1시간 전에 냉동해야 해요. 안 하면 오븐에서 다 녹아버려요. 살짝 덜 익은 느낌일 때 꺼내는 게 포인트!',ingredients:[{group:'반죽 (~10개)',items:[{name:'무염 버터, 상온',amount:'120g'},{name:'백설탕',amount:'60g'},{name:'갈색설탕',amount:'60g'},{name:'소금',amount:'2g'},{name:'달걀, 상온',amount:'1개'},{name:'바닐라 익스트랙',amount:'1 작은술'},{name:'중력분',amount:'190g'},{name:'베이킹소다',amount:'2g'},{name:'시나몬 파우더',amount:'2g'},{name:'로투스 비스코프 쿠키',amount:'22개'},{name:'마시멜로, 냉동한 것',amount:'10개'}]}],steps:['마시멜로를 굽기 최소 1시간 전에 냉동해요.','버터를 크리미하게 풀고 설탕 두 종류를 넣어 2분간 폭신하게 섞어요.','달걀, 소금, 바닐라를 넣고 섞어요.','밀가루, 시나몬, 베이킹소다를 체에 쳐서 버터 믹스에 넣어요.','비스코프 12개를 부숴 반죽에 넣고 가루가 보이지 않을 정도로만 섞어요.','랩에 싸서 냉장고에 1시간 휴지시켜요.','오븐을 340°F (170°C)로 예열하고 유산지를 깔아요.','반죽을 10개로 나눠 펼친 후 냉동 마시멜로를 넣고 꽉 감싸요.','비스코프 1개를 반죽 위에 올려 눌러요.','12분 구워요. 덜 익어 보여도 괜찮아요 — 10분 식히면 완성!'],alt:null}
  },
  {id:12,category:'baking',
   en:{name:'Peanut Butter Banana Muffins',cat:'🧁 Baking',desc:'3-ingredient banana muffins loaded with peanut butter and blueberries. No flour needed.',time:'25 min',diff:'Easy',tip:'The riper the bananas, the sweeter! Black-spotted bananas are perfect. Frozen blueberries work just as well as fresh.',ingredients:[{group:'Batter',items:[{name:'Ripe bananas',amount:'2 large'},{name:'Natural peanut butter',amount:'150g'},{name:'Fresh or frozen blueberries',amount:'150g'},{name:'Eggs',amount:'2 large'},{name:'Baking powder',amount:'1 tsp'}]}],steps:['Preheat oven to 355°F (180°C). Line a muffin tin with paper liners or grease well.','Peel and mash bananas with a fork until mostly smooth.','Add peanut butter and eggs. Mix until combined — the batter will be thick.','Stir in baking powder.','Gently fold in blueberries. Don\'t overmix or they\'ll bleed color throughout.','Spoon into muffin cups, filling each about ¾ full.','Bake 15 min until a toothpick comes out clean.','Cool 5 min in the pan. These taste even better the next day!'],alt:null},
   ko:{name:'땅콩버터 머핀',cat:'🧁 베이킹',desc:'밀가루 없이 바나나, 땅콩버터, 블루베리로 만드는 초간단 머핀.',time:'25분',diff:'쉬움',tip:'바나나는 검은 점이 많을수록 달고 맛있어요. 냉동 블루베리도 생 블루베리만큼 잘 돼요.',ingredients:[{group:'반죽',items:[{name:'잘 익은 바나나',amount:'2개'},{name:'땅콩버터',amount:'150g'},{name:'블루베리 (생 또는 냉동)',amount:'150g'},{name:'달걀',amount:'2개'},{name:'베이킹파우더',amount:'1 작은술'}]}],steps:['오븐을 355°F (180°C)로 예열하고 머핀 틀에 유산지를 깔아요.','바나나를 포크로 부드럽게 으깨요.','땅콩버터와 달걀을 넣고 섞어요. 반죽이 걸쭉한 게 정상이에요.','베이킹파우더를 넣고 섞어요.','블루베리를 살살 접어 넣어요. 너무 많이 섞으면 반죽이 파래져요.','머핀 틀에 ¾씩 채워요.','15분 굽고 이쑤시개로 확인해요.','5분 식히고 꺼내요. 다음 날이 더 맛있어요!'],alt:null}

  {id:13,category:'baking',
   en:{name:'Sweet Potato Cheesecake',cat:'🧁 Baking',desc:'A dreamy autumn-inspired cheesecake with roasted sweet potato.',time:'50 min + 6hr chilling',diff:'Medium',tip:'Use roasted sweet potato, not boiled — the flavor is much richer. Microwave a medium sweet potato 6–8 min until soft, then scoop and mash.',ingredients:[{group:'Sweet Potato Layer',items:[{name:'Roasted sweet potato, mashed',amount:'100g'},{name:'Heavy cream, room temp',amount:'100g'}]},{group:'Cheesecake Base',items:[{name:'Cream cheese, room temp',amount:'150g'},{name:'Sugar',amount:'40g'},{name:'Eggs, room temp, beaten',amount:'90g (~2 medium)'},{name:'Lemon juice',amount:'5g (1 tsp)'}]}],steps:['Preheat oven to 410°F (210°C). Line a small baking pan with parchment.','Blend or mash roasted sweet potato with heavy cream until smooth. Set aside.','Beat cream cheese and sugar until smooth. Add eggs in two batches. Stir in lemon juice.','Gently combine both mixtures until just combined.','Strain through a fine mesh sieve — this makes the texture silky smooth.','Pour into pan. Bake 25 min — edges set, center slightly jiggly.','Cool at room temp, then refrigerate at least 6 hours before slicing.'],alt:null},
   ko:{name:'고구마 치즈케이크',cat:'🧁 베이킹',desc:'군고구마와 크림치즈가 만난 달콤하고 부드러운 치즈케이크.',time:'50분 + 6시간 냉장',diff:'보통',tip:'고구마는 반드시 구운 것을 써야 해요. 전자레인지에 6~8분 돌리면 간단해요. 삶은 고구마보다 풍미가 훨씬 진해요.',ingredients:[{group:'고구마 반죽',items:[{name:'군고구마, 으깬 것',amount:'100g'},{name:'생크림, 상온',amount:'100g'}]},{group:'치즈케이크 반죽',items:[{name:'크림치즈, 상온',amount:'150g'},{name:'설탕',amount:'40g'},{name:'달걀, 상온, 풀어둔 것',amount:'90g (~2개)'},{name:'레몬즙',amount:'5g (1 작은술)'}]}],steps:['오븐을 410°F (210°C)로 예열하고 소형 틀에 유산지를 깔아요.','군고구마와 생크림을 부드럽게 섞어요.','크림치즈와 설탕을 섞고 달걀을 두 번 나눠 넣은 뒤 레몬즙을 넣어요.','두 반죽을 합쳐 부드럽게 섞어요.','체에 한 번 걸러요 — 이 과정이 식감을 실크처럼 만들어줘요.','틀에 붓고 25분 구워요. 중앙이 살짝 출렁이면 완성이에요.','실온에서 식힌 후 6시간 이상 냉장해요.'],alt:null}
  },
  {id:14,category:'baking',
   en:{name:'Banana Pudding',cat:'🧁 Baking',desc:'Layered American-style banana pudding with homemade custard, whipped cream, and cookies.',time:'40 min + 1hr chilling',diff:'Medium',tip:'Don\'t walk away from the custard on the stove — it thickens fast and will scorch on the bottom if you stop stirring. Keep going the whole time!',ingredients:[{group:'Custard',items:[{name:'Egg yolks',amount:'3 large'},{name:'Sugar',amount:'60g'},{name:'Cornstarch',amount:'15g'},{name:'Whole milk',amount:'300g'},{name:'Unsalted butter',amount:'10g'},{name:'Vanilla extract',amount:'1 tsp'}]},{group:'Whipped Cream',items:[{name:'Heavy cream, cold',amount:'200g'},{name:'Sugar',amount:'20g'}]},{group:'Layers',items:[{name:'Vanilla wafers or egg crackers (계란과자)',amount:'1 pack'},{name:'Ripe bananas, sliced',amount:'2–3'}]}],steps:['Whisk egg yolks, sugar, and cornstarch together in a saucepan until pale and smooth.','Pour in milk while whisking. Place over medium-low heat.','Cook, stirring constantly without stopping, until thick enough to coat the back of a spoon — about 8–10 min.','Remove from heat. Stir in butter and vanilla. Press plastic wrap directly on the surface (prevents a skin). Chill 1 hour.','Beat cold heavy cream and sugar with a hand mixer until stiff peaks form.','Stir chilled custard to loosen. Fold in ⅓ of whipped cream to lighten, then fold in the rest gently with a spatula.','Layer in a bowl or cups: custard → cookies → banana slices. Repeat, finishing with custard on top.','Crumble cookies on top for garnish. Refrigerate until ready to serve.'],alt:null},
   ko:{name:'바나나 푸딩',cat:'🧁 베이킹',desc:'직접 만든 커스터드와 생크림, 쿠키가 층층이 쌓인 바나나 푸딩.',time:'40분 + 1시간 냉장',diff:'보통',tip:'커스터드는 절대 자리를 비우면 안 돼요! 계속 저으면서 익혀야 바닥이 타지 않아요.',ingredients:[{group:'커스터드',items:[{name:'달걀 노른자',amount:'3개'},{name:'설탕',amount:'60g'},{name:'옥수수전분',amount:'15g'},{name:'우유',amount:'300g'},{name:'무염 버터',amount:'10g'},{name:'바닐라 익스트랙',amount:'1 작은술'}]},{group:'생크림',items:[{name:'생크림, 차가운 것',amount:'200g'},{name:'설탕',amount:'20g'}]},{group:'레이어',items:[{name:'계란과자 또는 바닐라웨이퍼',amount:'1봉'},{name:'잘 익은 바나나, 슬라이스',amount:'2~3개'}]}],steps:['냄비에 달걀 노른자, 설탕, 옥수수전분을 넣고 거품기로 섞어요.','우유를 넣으면서 섞어요. 중약불에서 계속 저으면서 익혀요.','8~10분간 저으면서 걸쭉해질 때까지 끓여요.','불 끄고 버터와 바닐라를 넣어요. 랩을 표면에 밀착시켜 1시간 냉장해요.','차가운 생크림과 설탕을 뿔이 올라올 때까지 휘핑해요.','식힌 커스터드를 살짝 풀고 생크림을 두 번 나눠 주걱으로 섞어요.','그릇에 커스터드 → 계란과자 → 바나나 순으로 쌓아요. 반복 후 커스터드로 마무리해요.','계란과자를 부숴 위에 뿌리고 냉장 보관해요.'],alt:null}

  {id:15,category:'baking',
   en:{name:'Pistachio Raspberry Cheesecake',cat:'🧁 Baking',desc:'An elegant cheesecake on a pistachio cookie crust, topped with fluffy raspberry cream.',time:'1hr 30min + 6hr chilling',diff:'Hard',tip:'Plan a day ahead — the cheesecake must fully chill before adding raspberry cream or the layers will mix. Slice with a warm knife for clean, beautiful cuts.',ingredients:[{group:'Crust',items:[{name:'Whole wheat cookies',amount:'90g'},{name:'Roasted pistachios',amount:'20g'},{name:'Melted unsalted butter',amount:'35g'}]},{group:'Cheesecake Filling',items:[{name:'Cream cheese, softened (microwave 30 sec)',amount:'340g'},{name:'Sugar',amount:'80g'},{name:'Eggs',amount:'2 large'},{name:'Heavy cream',amount:'155g'},{name:'Cornstarch',amount:'10g'},{name:'Pistachio paste',amount:'65g'}]},{group:'Raspberry Cream',items:[{name:'Raspberry jam',amount:'65g'},{name:'Cream cheese',amount:'28g'},{name:'Heavy cream, cold',amount:'160g'}]},{group:'Garnish',items:[{name:'Crushed egg crackers or cookies',amount:'a handful'},{name:'Fresh or freeze-dried raspberries',amount:'optional'}]}],steps:['Crust: pulse cookies and pistachios in a food processor to fine crumbs. Mix with melted butter. Press firmly into a springform pan. Bake at 340°F (170°C) for 5 min. Cool.','Microwave cream cheese 30 sec, beat until smooth. Add sugar and mix well.','Add eggs one at a time, mixing gently after each. Stir in heavy cream, cornstarch, and pistachio paste.','Pour over the crust. Bake at 355°F (180°C) for 45 min — edges set, center jiggles slightly.','Cool at room temp at least 30 min. Wrap tightly with plastic and refrigerate at least 6 hours.','Raspberry cream: beat jam and cream cheese together until smooth. Add cold cream in 3 additions, whipping each time until thick and spreadable.','Spread or pipe raspberry cream over the chilled cheesecake. Top with crumbled cookies.','Slice with a warm knife (dip in hot water, wipe dry) for clean cuts.'],alt:null},
   ko:{name:'피스타치오 라즈베리 케이크',cat:'🧁 베이킹',desc:'피스타치오 쿠키 크러스트 위에 라즈베리 크림을 얹은 고급스러운 케이크.',time:'1시간 30분 + 6시간 냉장',diff:'어려움',tip:'하루 전날 만드는 걸 추천해요. 치즈케이크가 충분히 냉장돼야 라즈베리 크림이 예쁘게 올라가요.',ingredients:[{group:'크러스트',items:[{name:'통밀쿠키',amount:'90g'},{name:'구운 피스타치오',amount:'20g'},{name:'무염 버터, 녹인 것',amount:'35g'}]},{group:'치즈케이크 필링',items:[{name:'크림치즈, 전자레인지 30초',amount:'340g'},{name:'설탕',amount:'80g'},{name:'달걀',amount:'2개'},{name:'생크림',amount:'155g'},{name:'옥수수전분',amount:'10g'},{name:'피스타치오 페이스트',amount:'65g'}]},{group:'라즈베리 크림',items:[{name:'라즈베리잼',amount:'65g'},{name:'크림치즈',amount:'28g'},{name:'생크림, 차가운 것',amount:'160g'}]},{group:'토핑',items:[{name:'계란과자 또는 쿠키, 부순 것',amount:'한 줌'},{name:'라즈베리 (생 또는 동결건조)',amount:'선택'}]}],steps:['크러스트: 쿠키와 피스타치오를 갈고 버터와 섞어요. 스프링폼 팬에 꾹꾹 눌러 깔고 340°F (170°C)에서 5분 구워요.','크림치즈를 전자레인지에 30초 돌리고 부드럽게 풀어요. 설탕을 넣고 섞어요.','달걀을 하나씩 넣어요. 생크림, 옥수수전분, 피스타치오 페이스트를 넣어요.','크러스트 위에 붓고 355°F (180°C)에서 45분 구워요.','30분 실온 식힌 후 랩으로 싸서 6시간 이상 냉장해요.','라즈베리 크림: 잼과 크림치즈를 섞고 생크림을 세 번 나눠 넣으며 두껍게 휘핑해요.','냉장된 케이크 위에 크림을 얹고 쿠키 크럼블로 장식해요.','따뜻한 물에 데운 칼로 깔끔하게 썰어요.'],alt:null}
  },
  {id:16,category:'korean',
   en:{name:'Candied Anchovy Stir-Fry',cat:'🇰🇷 Korean',desc:'A sweet, savory, and nutty Korean side dish. Goes with absolutely everything.',time:'15 min',diff:'Easy',tip:'Use small dried anchovies (잔멸치), not big ones. Dry-toasting them first removes any fishy smell and makes them wonderfully crispy.',ingredients:[{group:'Main',items:[{name:'Small dried anchovies (잔멸치)',amount:'50g'},{name:'Mixed nuts (walnuts, almonds, etc.)',amount:'1 handful'}]},{group:'Sauce',items:[{name:'Soy sauce (진간장)',amount:'1 tbsp'},{name:'Mirin',amount:'2 tbsp'},{name:'Allulose (or sugar)',amount:'2 tbsp'},{name:'Sesame oil',amount:'½ tbsp'},{name:'Cooking oil',amount:'1 tbsp'}]}],steps:['Dry-toast anchovies in a pan (no oil) over medium heat, stirring constantly, 2–3 min until crispy and nutty-smelling. Remove and set aside.','Add cooking oil to the same pan. Stir-fry nuts 1–2 min over medium heat until lightly golden.','Add toasted anchovies back in. Pour in soy sauce, mirin, and allulose.','Stir over medium-low heat 1–2 min until sauce coats everything and turns slightly sticky.','Turn off heat, drizzle sesame oil, and toss.','Spread on a plate to cool — they crisp up more as they cool. Serve as banchan with rice.'],alt:null},
   ko:{name:'멸치볶음',cat:'🇰🇷 한식',desc:'달달하고 고소한 클래식 밑반찬. 어떤 음식에도 잘 어울려요.',time:'15분',diff:'쉬움',tip:'잔멸치(작은 것)를 써야 해요. 기름 없이 먼저 볶으면 비린내가 없어지고 더 바삭해져요!',ingredients:[{group:'주재료',items:[{name:'잔멸치',amount:'50g'},{name:'견과류 (호두, 아몬드 등)',amount:'한 줌'}]},{group:'양념',items:[{name:'진간장',amount:'1 큰술'},{name:'미림',amount:'2 큰술'},{name:'알룰로스 (또는 설탕)',amount:'2 큰술'},{name:'참기름',amount:'½ 큰술'},{name:'식용유',amount:'1 큰술'}]}],steps:['팬에 기름 없이 잔멸치를 중불에서 2~3분 볶아요. 고소한 냄새가 나고 바삭해지면 꺼내요.','같은 팬에 식용유를 두르고 견과류를 1~2분 볶아요.','멸치를 다시 넣고 간장, 미림, 알룰로스를 부어요.','중약불에서 1~2분 볶아 양념이 골고루 입혀지고 살짝 끈적해질 때까지요.','불을 끄고 참기름을 넣고 섞어요.','접시에 펴서 식혀요 — 식으면서 더 바삭해져요. 밥반찬으로 내요.'],alt:null}
  }
];

let activeFilter='all',searchQuery='';
function setLang(l,btn){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.body.classList.toggle('ko',l==='ko');const t=ui[l];document.getElementById('header-title').innerHTML=t.title;document.getElementById('header-sub').textContent=t.sub;document.getElementById('filter-label').textContent=t.filterLabel;document.getElementById('btn-all').textContent=t.all;document.getElementById('btn-korean').textContent=t.korean;document.getElementById('btn-western').textContent=t.western;document.getElementById('btn-baking').textContent=t.baking;document.getElementById('search-input').placeholder=t.search;renderGrid();}
function filterRecipes(cat,btn){activeFilter=cat;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderGrid();}
function searchRecipes(q){searchQuery=q.toLowerCase();renderGrid();}
function renderGrid(){const grid=document.getElementById('grid');const t=ui[lang];const filtered=recipes.filter(r=>{const d=r[lang];const matchCat=activeFilter==='all'||r.category===activeFilter;const matchSearch=!searchQuery||d.name.toLowerCase().includes(searchQuery)||r.en.name.toLowerCase().includes(searchQuery)||d.desc.toLowerCase().includes(searchQuery);return matchCat&&matchSearch;});if(!filtered.length){grid.innerHTML=`<div class="no-results"><span>🍽️</span>${t.noResults}</div>`;return;}grid.innerHTML=filtered.map(r=>{const d=r[lang];const subName=lang==='ko'?r.en.name:r.ko.name;return `<div class="card" onclick="openModal(${r.id})"><div class="card-color bar-${r.category}"></div><div class="card-body"><span class="card-tag tag-${r.category}">${d.cat}</span><h2>${d.name}</h2><p style="font-size:.8rem;color:rgba(61,43,31,.4);margin-bottom:8px;font-style:italic;">${subName}</p><p class="desc">${d.desc}</p><div class="card-meta"><span>⏱ ${d.time}</span><span>📊 ${d.diff}</span></div></div></div>`;}).join('');}
function openModal(id){const r=recipes.find(x=>x.id===id);if(!r)return;const d=r[lang];const t=ui[lang];const subName=lang==='ko'?r.en.name:r.ko.name;const ingHTML=d.ingredients.map(g=>`<div class="ing-group">${g.group?`<div class="ing-group-label">${g.group}</div>`:''} ${g.items.map(i=>`<div class="ing-row"><span class="ing-name">${i.name}</span><span class="ing-amount">${i.amount}</span></div>`).join('')}</div>`).join('');const stepsHTML=d.steps.map((s,i)=>`<li class="step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></li>`).join('');document.getElementById('modal').innerHTML=`<div class="modal-header"><span class="card-tag tag-${r.category}">${d.cat}</span><h2>${d.name}</h2><p class="sub-name">${subName}</p><button class="close-btn" onclick="closeModalDirect()">✕</button></div><div class="modal-body">${d.tip?`<div class="modal-tip"><strong>${t.beforeStart}</strong> ${d.tip}</div>`:''}<div class="section-label">${t.ingredients}</div><div class="ingredients">${ingHTML}</div><div class="section-label">${t.steps}</div><ol class="steps">${stepsHTML}</ol>${d.alt?`<div class="alt-option"><strong>${t.tipVariation}</strong> ${d.alt}</div>`:''}</div>`;document.getElementById('modalOverlay').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(e){if(e.target===document.getElementById('modalOverlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modalOverlay').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalDirect();});
renderGrid();
</script>
